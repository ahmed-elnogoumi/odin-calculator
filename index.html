<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Calculator</title>
</head>
<body>
    <div id="calculator">
        <div id="numberField"></div>
        <div id="keys">
            <div class="row">
                <div id="backspace" class="key">&#9003;</div>
                <div id="clear" class="key">C</div>
                <div id="decimal" class=" key">.</div>
                <div id="divide" class="operator key">&divide;</div>
            </div>
            <div class="row">
                <div class="number key">9</div>
                <div class="number key">8</div>
                <div class="number key">7</div>
                <div id="multiply" class="operator key">&times;</div>
            </div>
            <div class="row">
                <div class="number key">6</div>
                <div class="number key">5</div>
                <div class="number key">4</div>
                <div id="subtract" class="operator key">-</div>
            </div>
            <div class="row">
                <div class="number key">3</div>
                <div class="number key">2</div>
                <div class="number key">1</div>
                <div id="add" class="operator key">+</div>
            </div>
            <div class="row">
                <div class="blank"></div>
                <div class="number key">0</div>
                 <div class="blank"></div>
                <div id="equal" class="key">=</div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
