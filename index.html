<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="style.css" rel="stylesheet">
    <title>Calculator &#128425;</title>
</head>
<body>
    <div id="calculator">
        <div id="numberField"></div>
        <!--TODO: Work on calculator layout-->
        <div id="keys">
            <div class="row">
                <div class="number key">9</div>
                <div class="number key">8</div>
                <div class="number key">7</div>
                <div class="key">*</div>
            </div>
            <div class="row">
                <div class="number key">6</div>
                <div class="number key">5</div>
                <div class="number key">4</div>
                <div class="key">-</div>
            </div>
            <div class="row">
                <div class="number key">3</div>
                <div class="number key">2</div>
                <div class="number key">1</div>
                 <div class="key">+</div>
            </div>
            <div class="row">
                <div class="key">.</div>
                <div class="number key">0</div>
                 <div class="key">/</div>
                <div class="key">=</div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
